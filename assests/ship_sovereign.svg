<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Deep Void Kuiper Nebula Gradient -->
    <radialGradient id="neptuneVoid" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0c2340"/>
      <stop offset="55%" stop-color="#030b14"/>
      <stop offset="100%" stop-color="#010307"/>
    </radialGradient>

    <!-- Neptune Azure Atmosphere Horizon -->
    <radialGradient id="neptuneSphere" cx="75%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="85%" stop-color="#0c2340"/>
      <stop offset="100%" stop-color="#020817"/>
    </radialGradient>

    <!-- Dark Matter Warp Hull Gradient -->
    <linearGradient id="warpDarkHull" x1="0%" y1="0%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#0284c7"/>
      <stop offset="65%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Azure Neon Glow Accent -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Dark Matter Warp Core Glow -->
    <radialGradient id="warpCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="80%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Cosmos Background -->
  <rect width="500" height="500" fill="url(#neptuneVoid)"/>

  <!-- Stars & Kuiper Belt Ice Dust -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="50" cy="70" r="1.3"/>
    <circle cx="160" cy="35" r="1.7"/>
    <circle cx="370" cy="60" r="1.2"/>
    <circle cx="440" cy="150" r="1.8"/>
    <circle cx="70" cy="390" r="1.4"/>
    <circle cx="410" cy="420" r="1.5"/>
  </g>

  <!-- Distant Glowing Neptune Sphere -->
  <circle cx="400" cy="400" r="140" fill="url(#neptuneSphere)" opacity="0.6"/>
  <ellipse cx="400" cy="400" rx="140" ry="25" fill="none" stroke="#bae6fd" stroke-width="1.5" opacity="0.25" transform="rotate(-25 400 400)"/>

  <!-- Main Neptune Void Sovereign Vessel -->
  <g transform="translate(0, -5)">
    <!-- Dark-Matter Warp Plasma Exhaust Streams -->
    <ellipse cx="180" cy="390" rx="10" ry="50" fill="url(#warpCoreGlow)"/>
    <ellipse cx="250" cy="405" rx="16" ry="60" fill="url(#warpCoreGlow)"/>
    <ellipse cx="320" cy="390" rx="10" ry="50" fill="url(#warpCoreGlow)"/>

    <!-- Outermost Dark-Matter Warp Nacelles (Floating Pylons) -->
    <!-- Left Nacelle -->
    <polygon points="120,190 145,290 115,360 90,260" fill="url(#warpDarkHull)"/>
    <line x1="105" y1="210" x2="130" y2="340" stroke="url(#cyanNeon)" stroke-width="3" opacity="0.9"/>
    <circle cx="105" cy="205" r="4" fill="#38bdf8"/>

    <!-- Right Nacelle -->
    <polygon points="380,190 355,290 385,360 410,260" fill="url(#warpDarkHull)"/>
    <line x1="395" y1="210" x2="370" y2="340" stroke="url(#cyanNeon)" stroke-width="3" opacity="0.9"/>
    <circle cx="395" cy="205" r="4" fill="#38bdf8"/>

    <!-- Main Sovereign Stealth Diamond Hull -->
    <polygon points="250,55 355,240 330,370 170,370 145,240" fill="url(#warpDarkHull)"/>
    
    <!-- Cyber Carbon Armor Plates -->
    <polygon points="250,90 320,225 295,350 205,350 180,225" fill="#090d16"/>
    <polygon points="250,115 290,215 275,330 225,330 210,215" fill="url(#warpDarkHull)"/>

    <!-- Dark-Matter Singularity Warp Core (Center Chamber) -->
    <circle cx="250" cy="245" r="18" fill="url(#warpCoreGlow)"/>
    <circle cx="250" cy="245" r="7" fill="#ffffff"/>
    <circle cx="250" cy="245" r="24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4"/>

    <!-- Sovereign Command Viewport -->
    <polygon points="250,130 265,170 235,170" fill="#38bdf8"/>
    <polygon points="250,140 260,165 240,165" fill="#ffffff"/>

    <text x="250" y="305" fill="#bae6fd" font-family="'Inter', sans-serif" font-weight="900" font-size="10" text-anchor="middle" letter-spacing="3">SOVEREIGN</text>
  </g>
</svg>
