<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Saturn Deep Space Gradient -->
    <radialGradient id="saturnSpace" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#062e24"/>
      <stop offset="60%" stop-color="#031612"/>
      <stop offset="100%" stop-color="#010806"/>
    </radialGradient>

    <!-- Saturn Shimmering Ice Rings Horizon -->
    <linearGradient id="iceRings" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#34d399" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#a7f3d0" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#059669" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ecfdf5" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Emerald Ringrunner Hull Gradient -->
    <linearGradient id="emeraldHull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="20%" stop-color="#34d399"/>
      <stop offset="65%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <!-- Titanium Plating -->
    <linearGradient id="titaniumPlating" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Solar Foil Wing Crystals -->
    <linearGradient id="crystalFoil" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#6ee7b7" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Ion Thruster Plume -->
    <radialGradient id="greenThrust" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Cosmos Background -->
  <rect width="500" height="500" fill="url(#saturnSpace)"/>

  <!-- Stars & Space Dust -->
  <g fill="#ffffff" opacity="0.65">
    <circle cx="60" cy="90" r="1.4"/>
    <circle cx="140" cy="50" r="1.1"/>
    <circle cx="410" cy="80" r="1.6"/>
    <circle cx="450" cy="180" r="1.3"/>
    <circle cx="95" cy="410" r="1.5"/>
    <circle cx="380" cy="430" r="1.2"/>
  </g>

  <!-- Saturn Ice Ring Arcs in Background -->
  <ellipse cx="250" cy="520" rx="360" ry="140" fill="none" stroke="url(#iceRings)" stroke-width="26" opacity="0.85"/>
  <ellipse cx="250" cy="520" rx="390" ry="155" fill="none" stroke="url(#iceRings)" stroke-width="10" opacity="0.5"/>
  <ellipse cx="250" cy="520" rx="320" ry="120" fill="none" stroke="url(#iceRings)" stroke-width="14" opacity="0.7"/>

  <!-- Main Chronos Ringrunner Vessel -->
  <g transform="translate(0, -5)">
    <!-- Engine Dual Thruster Trails -->
    <ellipse cx="215" cy="385" rx="12" ry="42" fill="url(#greenThrust)"/>
    <ellipse cx="285" cy="385" rx="12" ry="42" fill="url(#greenThrust)"/>

    <!-- Swept-Forward Solar Foil Wings (Aerodynamic Slalom Gliders) -->
    <!-- Left Wing -->
    <polygon points="210,240 60,320 40,280 170,170" fill="url(#crystalFoil)"/>
    <polygon points="40,280 25,260 145,160 170,170" fill="url(#emeraldHull)"/>
    <line x1="50" y1="300" x2="160" y2="200" stroke="#a7f3d0" stroke-width="2" opacity="0.8"/>

    <!-- Right Wing -->
    <polygon points="290,240 440,320 460,280 330,170" fill="url(#crystalFoil)"/>
    <polygon points="460,280 475,260 355,160 330,170" fill="url(#emeraldHull)"/>
    <line x1="450" y1="300" x2="340" y2="200" stroke="#a7f3d0" stroke-width="2" opacity="0.8"/>

    <!-- Central Fuselage (Arrowhead Ring Piercer) -->
    <polygon points="250,75 305,240 295,360 205,360 195,240" fill="url(#titaniumPlating)"/>
    
    <!-- Emerald Center Plating -->
    <polygon points="250,95 285,220 270,335 230,335 215,220" fill="url(#emeraldHull)"/>

    <!-- Aerodynamic Cockpit Canter Canopy -->
    <polygon points="250,140 266,190 234,190" fill="#a7f3d0"/>
    <polygon points="250,150 262,185 238,185" fill="#ffffff"/>

    <!-- Titanium Spine & Stabilizer Fin -->
    <polygon points="250,195 256,325 244,325" fill="#f8fafc"/>
    <text x="250" y="270" fill="#ecfdf5" font-family="'Inter', sans-serif" font-weight="900" font-size="10" text-anchor="middle" letter-spacing="2">CHRONOS</text>

    <!-- Wingtip Ring Scanner Sensors -->
    <circle cx="35" cy="270" r="4" fill="#34d399"/>
    <circle cx="35" cy="270" r="2" fill="#ffffff"/>
    <circle cx="465" cy="270" r="4" fill="#34d399"/>
    <circle cx="465" cy="270" r="2" fill="#ffffff"/>
  </g>
</svg>
